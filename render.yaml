services:
  - type: web
    name: assignment06-rnn
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements-app.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: KERAS_BACKEND
        value: tensorflow
      - key: CUDA_VISIBLE_DEVICES
        value: '-1'
